name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Show PHP version (must be patched for PHP2Shell)
        run: php -v

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check
        run: find assets commands config controllers migrations models views web widgets -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Security audit (known vulnerable packages)
        run: composer audit --no-interaction

      - name: Static analysis
        run: composer static
        # non-blocking until the leftover template tests are cleaned up
        continue-on-error: true
