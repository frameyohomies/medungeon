# Apache vhost for medino-inventur (production, office network only)
# Install: /etc/apache2/sites-available/inventur.conf, then see docs/deploy.md

<VirtualHost *:80>
    ServerName inventur.sth.care
    Redirect permanent / https://inventur.sth.care/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventur.sth.care
    DocumentRoot /var/www/medino-inventur/web

    SSLEngine on
    # written and renewed by acme.sh (--install-cert)
    SSLCertificateFile /etc/ssl/certs/inventur.pem
    SSLCertificateKeyFile /etc/ssl/private/inventur.key

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    <Directory "/var/www/medino-inventur/web/">
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine on
        RewriteRule ^index.php/ - [L,R=404]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.php
    </Directory>

    # test entry point stays in git but must never be reachable
    <Files "index-test.php">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/inventur-error.log
    CustomLog ${APACHE_LOG_DIR}/inventur-access.log combined
</VirtualHost>
